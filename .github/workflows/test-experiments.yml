name: Test experiment matrix
on:
  pull_request:
  push:
    branches: [main, experiment-matrix-v4]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/*.test.mjs
